name: Deploy privacy policy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/theme-controller.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/privacy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build local site assets
        run: |
          npm ci
          npm run site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish public policy
        id: deployment
        uses: actions/deploy-pages@v4
