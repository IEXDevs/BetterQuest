name: Chrome Web Store release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  build:
    name: Test and package extension
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read and validate extension version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(node -p "JSON.parse(require('fs').readFileSync('public/manifest.json','utf8')).version")"
          if ! [[ "$CURRENT" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Invalid extension version: $CURRENT"
            exit 1
          fi
          node - "$CURRENT" <<'NODE'
          const v = process.argv[2];
          if (!v.split('.').every(n => Number(n) <= 65535)) throw new Error('Manifest version component exceeds 65535');
          NODE
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build extension
        run: npm run build:extn
      - name: Validate and zip production output
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const m = JSON.parse(readFileSync('dist/manifest.json', 'utf8'));
          if (m.version !== process.env.EXPECTED_VERSION) throw new Error('Built manifest version mismatch');
          for (const f of ['content.js','background.js','pdf.worker.min.mjs','icons/icon16.png','icons/icon32.png','icons/icon48.png','icons/icon128.png']) {
            if (!existsSync('dist/' + f)) throw new Error('Missing dist/' + f);
          }
          NODE
          mkdir -p release
          (cd dist && zip -qr "../release/betterquest-${EXPECTED_VERSION}.zip" .)
          unzip -p "release/betterquest-${EXPECTED_VERSION}.zip" manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{if(JSON.parse(s).version!==process.env.EXPECTED_VERSION)process.exit(1)})'
      - name: Upload immutable package
        uses: actions/upload-artifact@v4
        with:
          name: betterquest-extension-${{ steps.version.outputs.version }}
          path: release/betterquest-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Chrome Web Store
    needs: build
    # A failed test, build, package validation, or artifact upload prevents this job from starting.
    runs-on: ubuntu-latest
    environment:
      name: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: betterquest-extension-${{ needs.build.outputs.version }}
          path: release
      - name: Check store status, upload if needed, and submit
        env:
          CWS_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CHROME_WEBSTORE_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CHROME_WEBSTORE_EXTENSION_ID }}
          EXTENSION_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for key in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required Chrome Web Store environment value: $key"
              exit 1
            fi
          done

          ZIP="release/betterquest-${EXTENSION_VERSION}.zip"
          test -s "$ZIP"

          TOKEN_JSON="$(curl --fail-with-body --silent --show-error -X POST 'https://oauth2.googleapis.com/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode 'grant_type=refresh_token')"
          ACCESS_TOKEN="$(printf '%s' "$TOKEN_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const t=JSON.parse(s).access_token;if(!t)process.exit(1);process.stdout.write(t)})')"
          unset TOKEN_JSON
          echo "::add-mask::$ACCESS_TOKEN"
          ITEM="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          STATUS_URL="https://chromewebstore.googleapis.com/v2/$ITEM:fetchStatus"

          STATUS_FILE="$(mktemp)"
          UPLOAD_RESPONSE=""
          PUBLISH_RESPONSE=""
          trap 'rm -f "$STATUS_FILE" "$UPLOAD_RESPONSE" "$PUBLISH_RESPONSE"' EXIT
          echo "Checking the currently published and submitted Chrome Web Store versions..."
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$STATUS_URL" -o "$STATUS_FILE"

          DECISION="$(node - "$EXTENSION_VERSION" "$STATUS_FILE" <<'NODE'
          const fs = require('fs');
          const target = process.argv[2];
          const status = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const parse = value => {
            if (typeof value !== 'string' || !/^\d+(\.\d+){0,3}$/.test(value) ||
                !value.split('.').every(n => Number(n) <= 65535)) {
              throw new Error('Invalid version encountered while comparing Chrome Web Store status');
            }
            return value.split('.').map(Number);
          };
          const compare = (left, right) => {
            const a = parse(left), b = parse(right);
            for (let i = 0; i < 4; i++) {
              const x = a[i] || 0, y = b[i] || 0;
              if (x !== y) return x > y ? 1 : -1;
            }
            return 0;
          };
          const revisionVersion = revision =>
            revision?.distributionChannels?.map(channel => channel.crxVersion).find(Boolean);
          const published = revisionVersion(status.publishedItemRevisionStatus);
          const submittedRevision = status.submittedItemRevisionStatus;
          const submitted = revisionVersion(submittedRevision);
          if (published) {
            const cmp = compare(target, published);
            if (cmp === 0) {
              console.log('SKIP: The manifest version is already published.');
              process.exit(0);
            }
            if (cmp < 0) throw new Error(`Manifest version ${target} is older than published version ${published}; increase the manifest version.`);
          }
          if (submitted) {
            const cmp = compare(target, submitted);
            if (cmp === 0) {
              console.log(`SKIP: Version ${target} is already submitted/drafted (state: ${submittedRevision.state || 'unknown'}); no duplicate upload is needed.`);
              process.exit(0);
            }
            if (cmp < 0) throw new Error(`Manifest version ${target} is older than submitted version ${submitted}; increase the manifest version.`);
            if (['PENDING_REVIEW', 'STAGED'].includes(submittedRevision.state)) {
              throw new Error(`Version ${submitted} is already ${submittedRevision.state}; Chrome Web Store will not accept another upload while that submission is active.`);
            }
          }
          console.log('RELEASE: Store status allows an upload/submission attempt.');
          NODE
          )"
          echo "$DECISION"
          if [[ "$DECISION" == SKIP:* ]]; then
            exit 0
          fi

          UPLOAD_RESPONSE="$(mktemp)"
          echo "Uploading release package for version $EXTENSION_VERSION..."
          UPLOAD_CODE="$(curl --silent --show-error -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --upload-file "$ZIP" \
            -o "$UPLOAD_RESPONSE" -w '%{http_code}' \
            "https://chromewebstore.googleapis.com/upload/v2/$ITEM:upload")"

          if [[ ! "$UPLOAD_CODE" =~ ^2[0-9][0-9]$ ]]; then
            if grep -Eiq 'version.{0,100}(greater|higher|increase|same|already)|already.{0,100}version' "$UPLOAD_RESPONSE"; then
              echo "::warning::Chrome Web Store reports that this version is already uploaded. Continuing to submit the existing draft."
            else
              cat "$UPLOAD_RESPONSE"
              echo "::error::Chrome Web Store upload failed with HTTP $UPLOAD_CODE."
              exit 1
            fi
          else
            cat "$UPLOAD_RESPONSE"
            echo
            UPLOAD_STATE="$(node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).uploadState || ""))' < "$UPLOAD_RESPONSE")"
            if [[ "$UPLOAD_STATE" == *IN_PROGRESS* ]]; then
              echo "Upload is processing; polling Chrome Web Store status..."
              COMPLETE=false
              for attempt in $(seq 1 18); do
                sleep 5
                curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer $ACCESS_TOKEN" \
                  "$STATUS_URL" -o "$STATUS_FILE"
                STATE="$(node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).lastAsyncUploadState || ""))' < "$STATUS_FILE")"
                if [[ "$STATE" == *IN_PROGRESS* ]]; then
                  continue
                elif [[ "$STATE" == *FAILURE* ]]; then
                  echo "::error::Chrome Web Store reported that the asynchronous upload failed."
                  cat "$STATUS_FILE"
                  exit 1
                else
                  COMPLETE=true
                  break
                fi
              done
              if [[ "$COMPLETE" != true ]]; then
                echo "::error::Upload is still processing after 90 seconds. Re-run the workflow; it will re-check store status and avoid a duplicate version."
                exit 1
              fi
            fi
          fi

          echo "Submitting the version for review..."
          PUBLISH_RESPONSE="$(mktemp)"
          PUBLISH_CODE="$(curl --silent --show-error -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"blockOnWarnings":true}' \
            -o "$PUBLISH_RESPONSE" -w '%{http_code}' \
            "https://chromewebstore.googleapis.com/v2/$ITEM:publish")"

          if [[ ! "$PUBLISH_CODE" =~ ^2[0-9][0-9]$ ]]; then
            cat "$PUBLISH_RESPONSE"
            echo "::error::Chrome Web Store submission failed with HTTP $PUBLISH_CODE. A new push or manual workflow run can retry after the underlying issue is fixed."
            exit 1
          fi
          cat "$PUBLISH_RESPONSE"
          echo
          echo "Submitted to Chrome Web Store; Google review/processing may still be required."
